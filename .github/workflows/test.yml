name: Tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Unit tests
        run: python -m pytest
      - name: Compile Python
        run: python -m compileall -q subliminal
      - name: Check shell syntax
        run: bash -n install.sh run.sh uninstall.sh
