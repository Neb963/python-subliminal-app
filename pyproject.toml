[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "subliminal-overlay"
version = "1.4.0"
description = "Click-through subliminal text and image overlay for KDE Plasma Wayland"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Neb963"}]
dependencies = ["Pillow>=10.0"]

[project.scripts]
subliminal = "subliminal.main:main"

[tool.setuptools]
packages = ["subliminal"]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
